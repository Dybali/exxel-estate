name: Mittwald test container
# Every push to main: tests → Docker image on GitHub Container Registry → Mittwald test container
# (test.estatemarket24.com). The Cloudflare deploy in verify-site.yml is independent and unchanged.
# Production promotion will be a separate, manually started workflow (not added yet).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mittwald-test
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/dybali/exxel-estate
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm test
      - run: node node_modules/typescript/bin/tsc --project tsconfig.site.json --pretty false

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Needs the MITTWALD_API_TOKEN repository secret and the MITTWALD_PROJECT_ID and
  # MITTWALD_SERVICE_ID repository variables (docs/mittwald-migration.md, Aşama 2). Without them
  # the job only prints a notice and succeeds, like the Cloudflare deploy in verify-site.yml.
  deploy-test:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: deploy-mittwald-test
      cancel-in-progress: false
    env:
      MITTWALD_API_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
      MITTWALD_PROJECT_ID: ${{ vars.MITTWALD_PROJECT_ID }}
      MITTWALD_SERVICE_ID: ${{ vars.MITTWALD_SERVICE_ID }}
      MITTWALD_TEST_URL: ${{ vars.MITTWALD_TEST_URL }}
    steps:
      - name: Check Mittwald settings
        id: creds
        run: |
          if [ -n "$MITTWALD_API_TOKEN" ] && [ -n "$MITTWALD_PROJECT_ID" ] && [ -n "$MITTWALD_SERVICE_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Mittwald secret/variables are not set; skipping the test deploy."; fi
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Install mittwald CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm install -g @mittwald/cli@1.26.0 --no-audit --no-fund
      - name: Point the test container at this commit's image
        if: steps.creds.outputs.ready == 'true'
        # The CLI reads the API token from MITTWALD_API_TOKEN. The mittwald API sometimes answers 503 for a
        # while (maintenance, busy periods), and one CLI call then takes about four minutes to give up. So a
        # cheap request first waits up to 15 minutes for the API; if it stays down the run fails with the
        # API's own answer in the log (status with and without the token, headers, start of the body) instead
        # of being cancelled by the job timeout. Then the CLI gets three attempts.
        run: |
          api() { curl -s -m 10 -H "Authorization: Bearer $MITTWALD_API_TOKEN" "$@"; }
          code() { api -o /dev/null -w '%{http_code}' "https://api.mittwald.de/v2/$1" || true; }
          for attempt in $(seq 1 30); do
            status=$(code users/self)
            case "$status" in 000|502|503|504) ;; *) break ;; esac
            if [ "$attempt" = 1 ]; then
              echo "::warning::mittwald API answers $status; waiting up to 15 minutes for it to come back."
              echo "Same request without the token: $(curl -s -m 10 -o /dev/null -w '%{http_code}' https://api.mittwald.de/v2/users/self || true)"
              echo "Answer of the API (headers, start of the body):"
              api -i https://api.mittwald.de/v2/users/self | head -c 1500 || true
              echo
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::mittwald API still answers $status after 15 minutes; re-run this job when https://status.mittwald.de is green."
              exit 1
            fi
            sleep 30
          done
          # Blue/green (owner's setup 2026-11-24): containers "site" ($MITTWALD_SERVICE_ID) and "site-green"
          # ($GREEN_SERVICE); the public host points at one of them and the standby host at the other. The new
          # image goes to the standby container; only when it answers with this commit on the standby host does the
          # public host switch over, so visitors never meet a restarting container. If the setup cannot be read
          # (missing container or host, CLI or API answer not as expected), the single-container deploy below runs.
          GREEN_SERVICE=c-qu4u8m; PUBLIC_HOST=p-r9al26.project.space; STANDBY_HOST=yedek.p-r9al26.project.space
          bluegreen() {
            containers=$(mw container list --project-id "$MITTWALD_PROJECT_ID" --output json) || return 2
            hosts=$(mw domain virtualhost list --project-id "$MITTWALD_PROJECT_ID" --output json) || return 2
            uuid() { echo "$containers" | jq -r --arg s "$1" '[.[] | select([.. | strings] | index($s)) | .id][0] // empty'; }
            vhost() { echo "$hosts" | jq -r --arg h "$1" '[.[] | select([.. | strings] | index($h)) | .id][0] // empty'; }
            blue=$(uuid "$MITTWALD_SERVICE_ID"); green=$(uuid "$GREEN_SERVICE")
            public=$(vhost "$PUBLIC_HOST"); standby=$(vhost "$STANDBY_HOST")
            [ -n "$blue" ] && [ -n "$green" ] && [ -n "$public" ] && [ -n "$standby" ] || { echo "::notice::blue/green setup not found (containers $blue/$green, hosts $public/$standby)"; return 2; }
            if echo "$hosts" | jq -e --arg id "$public" --arg c "$green" '.[] | select(.id == $id) | [.. | strings] | index($c)' > /dev/null; then active=$green; idle=$blue; idle_short=$MITTWALD_SERVICE_ID; else active=$blue; idle=$green; idle_short=$GREEN_SERVICE; fi
            echo "Public host serves $active; deploying $GITHUB_SHA to $idle_short."
            timeout 300 mw domain virtualhost update "$standby" --path-to-container "/:$idle:3000/tcp" --quiet || return 1
            timeout 300 mw container update "$idle_short" --project-id "$MITTWALD_PROJECT_ID" --image "$IMAGE:$GITHUB_SHA" --quiet || return 1
            timeout 600 mw container recreate "$idle_short" --project-id "$MITTWALD_PROJECT_ID" --pull --quiet || return 1
            timeout 300 mw container recreate "$idle_short" --project-id "$MITTWALD_PROJECT_ID" --quiet || return 1
            for i in $(seq 1 40); do
              running=$(curl -fsS --max-time 10 -D - -o /dev/null "https://$STANDBY_HOST/api/health/live" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="x-app-commit"{print $2}')
              [ "$running" = "$GITHUB_SHA" ] && break
              [ "$i" = 40 ] && { echo "::error::the standby container did not start $GITHUB_SHA (running: ${running:-unknown}); the public site was not switched."; return 1; }
              sleep 10
            done
            timeout 300 mw domain virtualhost update "$public" --path-to-container "/:$idle:3000/tcp" --quiet || return 1
            timeout 300 mw domain virtualhost update "$standby" --path-to-container "/:$active:3000/tcp" --quiet || true
            echo "Public host now serves $GITHUB_SHA."
            return 0
          }
          set +e; bluegreen; result=$?; set -e
          [ "$result" = 0 ] && exit 0
          [ "$result" = 1 ] && exit 1
          for attempt in 1 2 3; do
            # Shorter outage (live-site sweep 2026-11-24: about 2 minutes of 502/503 per deploy): set the new image
            # without recreating, pull it while the old container keeps serving (recreate --pull only pulls; it does
            # not restart, which left three deploys unstarted on 2026-11-24), then recreate with the image already
            # on the host. True zero downtime needs a second container (blue/green, docs/mittwald-migration.md).
            if timeout 300 mw container update "$MITTWALD_SERVICE_ID" --project-id "$MITTWALD_PROJECT_ID" --image "$IMAGE:$GITHUB_SHA" --quiet \
              && timeout 600 mw container recreate "$MITTWALD_SERVICE_ID" --project-id "$MITTWALD_PROJECT_ID" --pull --quiet \
              && timeout 300 mw container recreate "$MITTWALD_SERVICE_ID" --project-id "$MITTWALD_PROJECT_ID" --quiet; then exit 0; fi
            echo "::warning::mittwald container update failed (attempt $attempt of 3). API answers: account $(code users/self), project $(code "projects/$MITTWALD_PROJECT_ID"), containers $(code "projects/$MITTWALD_PROJECT_ID/services")."
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          echo "::error::mittwald container update failed 3 times; see the API answers above. If only the project request fails, the project itself needs a look in mStudio."
          exit 1
      - name: Wait for the new container
        if: steps.creds.outputs.ready == 'true' && env.MITTWALD_TEST_URL != ''
        run: |
          # The old container answers too, so wait for this commit (X-App-Commit, app/api/health/live/route.ts).
          for attempt in $(seq 1 30); do
            running=$(curl -fsS --max-time 10 -D - -o /dev/null "$MITTWALD_TEST_URL/api/health/live" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="x-app-commit"{print $2}')
            if [ "$running" = "$GITHUB_SHA" ]; then echo "The new container ($GITHUB_SHA) is up."; exit 0; fi
            sleep 10
          done
          echo "::error::$MITTWALD_TEST_URL is not running $GITHUB_SHA after 5 minutes (running: ${running:-unknown}). The image may not have been started; check the container in mStudio."; exit 1
