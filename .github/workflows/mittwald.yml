name: Mittwald test container
# Every push to main: tests → Docker image on GitHub Container Registry → Mittwald test container
# (test.estatemarket24.com). The Cloudflare deploy in verify-site.yml is independent and unchanged.
# Production promotion will be a separate, manually started workflow (not added yet).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mittwald-test
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/dybali/exxel-estate
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm test
      - run: node node_modules/typescript/bin/tsc --project tsconfig.site.json --pretty false

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Needs the MITTWALD_API_TOKEN repository secret and the MITTWALD_PROJECT_ID and
  # MITTWALD_SERVICE_ID repository variables (docs/mittwald-migration.md, Aşama 2). Without them
  # the job only prints a notice and succeeds, like the Cloudflare deploy in verify-site.yml.
  deploy-test:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-mittwald-test
      cancel-in-progress: false
    env:
      MITTWALD_API_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
      MITTWALD_PROJECT_ID: ${{ vars.MITTWALD_PROJECT_ID }}
      MITTWALD_SERVICE_ID: ${{ vars.MITTWALD_SERVICE_ID }}
      MITTWALD_TEST_URL: ${{ vars.MITTWALD_TEST_URL }}
    steps:
      - name: Check Mittwald settings
        id: creds
        run: |
          if [ -n "$MITTWALD_API_TOKEN" ] && [ -n "$MITTWALD_PROJECT_ID" ] && [ -n "$MITTWALD_SERVICE_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Mittwald secret/variables are not set; skipping the test deploy."; fi
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Install mittwald CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm install -g @mittwald/cli@1.26.0 --no-audit --no-fund
      - name: Point the test container at this commit's image
        if: steps.creds.outputs.ready == 'true'
        # The CLI reads the API token from MITTWALD_API_TOKEN.
        run: mw container update "$MITTWALD_SERVICE_ID" --project-id "$MITTWALD_PROJECT_ID" --image "$IMAGE:$GITHUB_SHA" --recreate --quiet
      - name: Wait for the new container
        if: steps.creds.outputs.ready == 'true' && env.MITTWALD_TEST_URL != ''
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$MITTWALD_TEST_URL/api/health/live" > /dev/null; then echo "Test site is up."; exit 0; fi
            sleep 10
          done
          echo "::error::$MITTWALD_TEST_URL/api/health/live did not answer within 5 minutes."; exit 1
