name: estatemarket24 backups and checks
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [build-check, monitor, backup, restore-test]
        default: build-check
  schedule:
    - cron: '17 2 * * *'
    - cron: '29 3 1 * *'
    - cron: '43 * * * *'
permissions:
  contents: read
concurrency:
  group: estatemarket24-operations
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.EM24_OPERATIONS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODE: ${{ inputs.mode || (github.event.schedule == '17 2 * * *' && 'backup') || (github.event.schedule == '29 3 1 * *' && 'restore-test') || 'monitor' }}
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_SOURCE_TOKEN: ${{ secrets.BACKUP_SOURCE_TOKEN }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_GATEWAY_TOKEN: ${{ secrets.BACKUP_GATEWAY_TOKEN }}
      BACKUP_ALLOW_SAME_PROVIDER: ${{ vars.BACKUP_ALLOW_SAME_PROVIDER }}
      ALERT_TO: aliikocr10@gmail.com
      ALERT_FROM: ${{ secrets.ALERT_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare reviewed operational tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/em24-tools/operations"
          cat > "$RUNNER_TEMP/em24-tools/operations/.dockerignore" <<'EM24_FILE_0'
          **
          !launch-preflight.mjs
          !backup/
          !backup/package.json
          !backup/package-lock.json
          !backup/core.mjs
          !backup/database.mjs
          !backup/storage.mjs
          !backup/runner.mjs
          !backup/remote-restore.mjs
          !backup/cloud-config.mjs
          !backup/cloud-runner.mjs
          !backup/operational-alert.mjs
          !backup/cloud.Dockerfile
          
          !backup/test/
          !backup/test/cloud-config.test.mjs
          !backup/test/operational-alert.test.mjs
          !backup/test/backup.test.mjs
          
          EM24_FILE_0
          mkdir -p "$RUNNER_TEMP/em24-tools/operations"
          cat > "$RUNNER_TEMP/em24-tools/operations/launch-preflight.mjs" <<'EM24_FILE_1'
          // Read-only production smoke checks. No login attempts, uploads or paid AI calls.
          import fs from 'node:fs/promises';
          const base='https://exxel-estate.blue-grape-8839.chatgpt.site',checks=[];
          async function check(name,run){const start=Date.now();try{const details=await run();checks.push({name,passed:true,milliseconds:Date.now()-start,...details});}catch(e){checks.push({name,passed:false,milliseconds:Date.now()-start,error:e.message});}}
          function ensure(value,message){if(!value)throw Error(message);}
          async function get(path){return fetch(base+path,{redirect:'manual',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});}
          let first;
          for(const path of ['/','/giris','/ilanlar'])await check('public-page '+path,async()=>{const r=await get(path);ensure(r.status===200,'Expected HTTP 200');ensure(r.headers.get('x-content-type-options')==='nosniff','Missing MIME hardening');ensure(r.headers.get('referrer-policy')==='strict-origin-when-cross-origin','Missing referrer policy');await r.body?.cancel();return {status:r.status};});
          await check('published-listings-and-private-note-isolation',async()=>{const r=await get('/api/listings?page=1');ensure(r.status===200,'Listing API unavailable');const data=await r.json();ensure(Array.isArray(data.listings)&&Number.isInteger(data.total),'Invalid listing response');ensure(data.listings.every(x=>!Object.hasOwn(x,'reviewNote')&&!Object.hasOwn(x,'reviewedAt')&&!String(x.id).startsWith('ex-')),'Private review fields or demo listings exposed');first=data.listings[0];return {publishedTotal:data.total};});
          if(first){await check('listing-detail',async()=>{const r=await get('/api/listings/'+encodeURIComponent(first.id));ensure(r.status===200,'Listing detail unavailable');const data=await r.json();ensure(!Object.hasOwn(data.listing,'reviewNote'),'Private review note exposed');return {status:r.status};});await check('listing-photo-from-r2',async()=>{const image=first.images?.[0];ensure(typeof image==='string'&&image.startsWith('/api/media/'),'No same-origin listing photo');const r=await get(image);ensure(r.status===200&&r.headers.get('Content-Type')?.startsWith('image/'),'Listing photo unavailable');await r.body?.cancel();return {status:r.status};});}
          for(const [path,status] of [['/api/admin',403],['/api/messages',401],['/api/agent-verification?download=1',401],['/api/export',403],['/api/backup-storage',401],['/api/listings/ex-1002',404]])await check('anonymous-access '+path,async()=>{const r=await get(path);ensure(r.status===status,`Expected ${status}, received ${r.status}`);await r.body?.cancel();return {status:r.status};});
          await check('anonymous-account-is-private',async()=>{const r=await get('/api/account');ensure(r.status===200,'Account API unavailable');ensure(r.headers.get('cache-control')?.includes('no-store'),'Account response cacheable');ensure((await r.json()).user===null,'Anonymous request received a user');return {status:r.status};});
          const result={checkedAt:new Date().toISOString(),base,passed:checks.filter(x=>x.passed).length,total:checks.length,checks,limits:'Read-only smoke checks; not load, real-device, EIDS, e-mail delivery, scheduled monitoring or complete security audit.'};
          await fs.writeFile(new URL('./launch-preflight-result.json',import.meta.url),JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));if(result.passed!==result.total)process.exitCode=1;
          
          EM24_FILE_1
          mkdir -p "$RUNNER_TEMP/em24-tools/operations/backup"
          cat > "$RUNNER_TEMP/em24-tools/operations/backup/package.json" <<'EM24_FILE_2'
          {"name":"estatemarket24-backup","private":true,"type":"module","scripts":{"test":"node --test test/*.test.mjs","backup":"node cli.mjs backup","verify":"node cli.mjs verify","restore-test":"node cli.mjs restore-test"},"dependencies":{"@aws-sdk/client-s3":"^3.0.0","nodemailer":"10.2.0","pg":"^8.0.0"}}
          EM24_FILE_2
          mkdir -p "$RUNNER_TEMP/em24-tools/operations/backup"
          cat > "$RUNNER_TEMP/em24-tools/operations/backup/package-lock.json" <<'EM24_FILE_3'
