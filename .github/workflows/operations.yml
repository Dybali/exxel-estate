      - name: Prepare Node for lightweight site monitoring
        if: env.MODE == 'monitor'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run lightweight site monitor
        if: env.MODE == 'monitor'
        run: |
          cd "$RUNNER_TEMP/em24-tools/operations/backup"
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node cloud-runner.mjs monitor
      - name: Build isolated PostgreSQL 18 and Node 24 runner
        if: env.MODE != 'monitor'
        run: docker build -t em24-operations -f "$RUNNER_TEMP/em24-tools/operations/backup/cloud.Dockerfile" "$RUNNER_TEMP/em24-tools/operations"
      - name: Test isolated image without production credentials
        if: env.MODE == 'build-check'
        run: |
          docker run --rm --entrypoint node em24-operations --test /app/backup/test/cloud-config.test.mjs /app/backup/test/operational-alert.test.mjs /app/backup/test/backup.test.mjs
          docker run --rm --entrypoint pg_dump em24-operations --version
      - name: Prepare disposable restore target
        if: env.MODE == 'restore-test'
        run: |
          docker run -d --name em24-restore -e POSTGRES_PASSWORD=isolated-test-only -e POSTGRES_DB=em24_restore_monthly -p 127.0.0.1:55432:5432 postgres:18-bookworm
          for n in $(seq 1 30); do
            if docker exec em24-restore pg_isready -U postgres -d em24_restore_monthly; then break; fi
            sleep 2
          done
          echo 'RESTORE_DATABASE_URL=postgresql://postgres:isolated-test-only@127.0.0.1:55432/em24_restore_monthly?sslmode=disable' >> "$GITHUB_ENV"
      - name: Run operational job
        if: env.MODE != 'build-check' && env.MODE != 'monitor'
        run: |
          docker run --rm --network host \
            -e BACKUP_DATABASE_URL -e BACKUP_ENCRYPTION_KEY -e BACKUP_SOURCE_TOKEN \
            -e BACKUP_S3_ENDPOINT -e BACKUP_S3_BUCKET -e BACKUP_S3_ACCESS_KEY_ID -e BACKUP_S3_SECRET_ACCESS_KEY \
            -e BACKUP_GATEWAY_TOKEN -e BACKUP_ALLOW_SAME_PROVIDER -e RESTORE_DATABASE_URL \
            -e ALERT_TO -e ALERT_FROM -e SMTP_HOST -e SMTP_PORT -e SMTP_USER -e SMTP_PASSWORD \
            em24-operations "$MODE"
      - name: Stop disposable database
        if: always() && env.MODE == 'restore-test'
        run: docker rm -f em24-restore
