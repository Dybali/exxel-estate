          import pg from 'pg';
          import {spawn} from 'node:child_process';
          import {once} from 'node:events';
          import path from 'node:path';
          import {createGzip,createGunzip} from 'node:zlib';
          import {pipeline} from 'node:stream/promises';
          import {encryptStream,decryptStream,hashMeter,mediaReferences} from './core.mjs';
          const quote=name=>'"'+name.replaceAll('"','""')+'"';
          export function pgEnvironment(url){const u=new URL(url);return {...process.env,PGHOST:u.hostname,PGPORT:u.port||'5432',PGDATABASE:decodeURIComponent(u.pathname.slice(1)),PGUSER:decodeURIComponent(u.username),PGPASSWORD:decodeURIComponent(u.password),PGSSLMODE:u.searchParams.get('sslmode')||'verify-full',PGCONNECT_TIMEOUT:'30',PGAPPNAME:'estatemarket24-backup'};}
          export const pgTool=(bin,name)=>path.join(bin,name+(process.platform==='win32'?'.exe':''));
          export function childCommand(bin,name,args,url){const child=spawn(pgTool(bin,name),args,{env:pgEnvironment(url),stdio:['pipe','pipe','pipe'],windowsHide:true});let stderr='';child.stderr.on('data',b=>{stderr+=b.toString();});const complete=new Promise((resolve,reject)=>{child.once('error',()=>reject(Error(`${name} could not start`)));child.once('exit',code=>code===0?resolve():reject(Error(`${name} failed with code ${code}; credentials and raw stderr are omitted`)));});complete.catch(()=>{});return {child,complete,hasWarning:()=>stderr.trim().length>0};}
          export async function snapshot(databaseUrl){
