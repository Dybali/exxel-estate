          import {createHash,createCipheriv,createDecipheriv,randomBytes} from 'node:crypto';
          import {createReadStream,createWriteStream} from 'node:fs';
          import {mkdir,readFile,writeFile,rename,stat,open} from 'node:fs/promises';
          import {pipeline} from 'node:stream/promises';
          import {Readable,Transform} from 'node:stream';
          import path from 'node:path';
          export const MAGIC=Buffer.from('EM24B001');
          export const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
          export function safeId(id){if(!/^[a-z0-9][a-z0-9_-]{0,70}$/.test(id))throw Error('Invalid source or backup ID');return id;}
          export function blobPath(source,sha){safeId(source);if(!/^[a-f0-9]{64}$/.test(sha))throw Error('Invalid content digest');return `blobs/${source}/${sha}.enc`;}
          export function resolveInside(root,relative){const resolved=path.resolve(root,relative),base=path.resolve(root);if(!resolved.startsWith(base+path.sep))throw Error('Unsafe backup path');return resolved;}
          export async function hashFile(file){const h=createHash('sha256');for await(const chunk of createReadStream(file))h.update(chunk);return h.digest('hex');}
          export async function encryptStream(stream,file,key){
           if(key.length!==32)throw Error('A 256-bit backup key is required');await mkdir(path.dirname(file),{recursive:true});
           const partial=file+'.partial-'+randomBytes(6).toString('hex'),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),header=Buffer.concat([MAGIC,iv]);cipher.setAAD(header);
           const handle=await open(partial,'wx',0o600);await handle.write(header);await handle.close();
           await pipeline(stream,cipher,createWriteStream(partial,{flags:'a',mode:0o600}));
           const tail=await open(partial,'a');await tail.write(cipher.getAuthTag());await tail.close();await rename(partial,file);
           return {cipherSha256:await hashFile(file),encryptedBytes:(await stat(file)).size};
          }
          export async function decryptStream(file,key){const handle=await open(file,'r');try{const size=(await handle.stat()).size;if(size<36)throw Error('Truncated backup');const header=Buffer.alloc(20),tag=Buffer.alloc(16);await handle.read(header,0,20,0);await handle.read(tag,0,16,size-16);if(!header.subarray(0,8).equals(MAGIC))throw Error('Unknown backup format');const decipher=createDecipheriv('aes-256-gcm',key,header.subarray(8));decipher.setAAD(header);decipher.setAuthTag(tag);return {input:createReadStream(file,{start:20,end:size-17}),decipher};}finally{await handle.close();}}
          export async function decryptTo(file,key,destination){const {input,decipher}=await decryptStream(file,key);await pipeline(input,decipher,destination);}
          export async function readEncryptedJson(file,key){const chunks=[];await decryptTo(file,key,new Transform({transform(chunk,_,cb){chunks.push(chunk);cb();}}));return JSON.parse(Buffer.concat(chunks).toString('utf8'));}
          export async function writeEncryptedJson(file,key,data){return encryptStream(Readable.from([Buffer.from(JSON.stringify(data,null,2))]),file,key);}
          export async function storeEncryptedBlob(bytes,file,key){try{await stat(file);const meter=hashMeter();meter.stream.resume();await decryptTo(file,key,meter.stream);const plain=meter.result();if(plain.sha256!==digest(bytes))throw Error('Existing immutable backup blob is corrupt');return {cipherSha256:await hashFile(file),encryptedBytes:(await stat(file)).size};}catch(e){if(e.code!=='ENOENT')throw e;return encryptStream(Readable.from([bytes]),file,key);}}
          export function hashMeter(){const hash=createHash('sha256');let bytes=0;const stream=new Transform({transform(chunk,_,done){bytes+=chunk.length;hash.update(chunk);done(null,chunk);}});return {stream,result:()=>({sha256:hash.digest('hex'),bytes})};}
          export function parseMediaKey(value){if(typeof value!=='string')return null;const match=value.match(/^\/api\/media\/(listings\/[a-f0-9-]+\/[a-f0-9-]+\.(?:jpg|png|webp))$/i);return match?.[1]||null;}
          export function mediaReferences(table,row){
           const refs=[];const add=(source,key,sha256)=>{if(key)refs.push({source,key,...(sha256?{sha256}:{}),table});};
           const walk=value=>{if(typeof value==='string'){const key=parseMediaKey(value);if(key)add('listing-media',key);else if(value.startsWith('{')||value.startsWith('[')){try{walk(JSON.parse(value));}catch{}}}else if(Array.isArray(value))value.forEach(walk);else if(value&&typeof value==='object')Object.values(value).forEach(walk);};
           if(['listings','listing_drafts'].includes(table))walk(row);
           if(table==='users')walk(row.avatar_url);
           if(table==='property_images'&&row.storage_provider==='r2')add('listing-media',row.object_key,row.checksum_sha256);
           if(table==='office_verifications')add('private-media',row.object_key);
           if(table==='tour_capture_jobs'){
            if(['ready','accepted'].includes(row.state))add('private-media',row.result_key);
            if(['uploading','queued','processing'].includes(row.state)){try{for(const key of JSON.parse(row.files||'[]'))add('private-media',key);}catch{throw Error('Invalid tour source references');}}
           }
           return refs;
          }
          export function verifyReferenceMap(refs,objects){const lookup=new Map(objects.map(x=>[x.source+'\0'+x.key,x]));const missing=[];for(const ref of refs){const object=lookup.get(ref.source+'\0'+ref.key);if(!object||ref.sha256&&ref.sha256!==object.sha256)missing.push({source:ref.source,key:ref.key,table:ref.table});}if(missing.length)throw Error(`${missing.length} missing or mismatched database/media references; backup cannot be completed`);return refs.length;}
          export function validateConfig(config){
           if(!config.databaseUrl||!config.pgBin||!config.outputRoot||!config.encryptionKey)throw Error('Database, PostgreSQL tools, output path and encryption key are required');
           const url=new URL(config.databaseUrl);if(!['postgres:','postgresql:'].includes(url.protocol)||url.hostname.includes('-pooler.'))throw Error('A direct PostgreSQL connection is required');
           const key=Buffer.from(config.encryptionKey,'base64');if(key.length!==32)throw Error('Backup encryption key must be 32 bytes');
           if(!Array.isArray(config.sources)||!config.sources.length)throw Error('Source storage configuration is required');
           const ids=new Set();for(const s of config.sources){safeId(s.id);if(ids.has(s.id))throw Error('Duplicate source ID');ids.add(s.id);if(!s.bucket||!s.endpoint||s.type==='s3'&&(!s.accessKeyId||!s.secretAccessKey)||s.type==='http'&&(!s.token||s.token.length<48)||!['s3','http'].includes(s.type))throw Error('Read credentials are required for each source');if(!config.allowLocalTest&&!s.endpoint.startsWith('https://'))throw Error('Storage requires HTTPS');}
           for(const required of ['listing-media','private-media'])if(!ids.has(required))throw Error(`Missing source ${required}; photos AND private files must be covered`);
           if(config.remote){const r=config.remote;if(!r.bucket||!r.endpoint||(r.type==='backup-http'?(!r.token||r.token.length<48):(!r.accessKeyId||!r.secretAccessKey)))throw Error('Incomplete independent remote destination');if(config.sources.some(s=>s.endpoint===r.endpoint&&s.bucket===r.bucket))throw Error('The backup destination cannot be a source bucket');if(!r.endpoint.startsWith('https://')&&!config.allowLocalTest)throw Error('Remote backup requires HTTPS');if(/r2\.cloudflarestorage\.com/.test(r.endpoint)&&!config.allowSameProvider)throw Error('Choose an independent provider outside Cloudflare for remote backup');}
           return key;
          }
          export async function writeStatus(root,status){await mkdir(root,{recursive:true});const file=path.join(root,'status.json'),temp=file+'.tmp';await writeFile(temp,JSON.stringify(status,null,2),{mode:0o600});await rename(temp,file);}
          
