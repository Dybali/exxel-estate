name: Verify EstateMarket24 release
# Pull requests and manual runs only (2026-11-24, to save Actions minutes): every push to main is already
# tested, type-checked and built by .github/workflows/mittwald.yml (test job and Docker image).
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm run verify
  # No Cloudflare deploy since 2026-11-23 (owner's decision): the live site is the Mittwald container,
  # deployed by .github/workflows/mittwald.yml. The Worker exxel-estate stays as it was, without schedules.
